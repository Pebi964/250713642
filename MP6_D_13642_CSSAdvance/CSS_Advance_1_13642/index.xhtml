<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Lomba</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>

    <div class="form-container">
        <h1>Formulir Registrasi Lomba Kreatif</h1>
        <p class="subtitle">Silakan isi data tim dan karya Anda dengan lengkap dan benar.</p>
        
        <form action="" method="post" enctype="multipart/form-data">
            <table>
                <tr>
                    <td>
                        <label for="namatim"><strong>Nama Tim Peserta</strong></label>
                    </td>
                    <td>
                        <input type="text" id="namatim" name="namatim" placeholder="Masukkan nama tim..." />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="ketua"><strong>Nama Lengkap Ketua Tim</strong></label>
                    </td>
                    <td>
                        <input type="text" id="ketua" name="ketua" placeholder="Masukkan nama ketua..." />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="jumlah"><strong>Total Anggota Tim</strong></label>
                    </td>
                    <td>
                        <select id="jumlah" name="jumlah">
                            <option>1 Orang</option>
                            <option>2 Orang</option>
                            <option>3 Orang</option>
                            <option>4 Orang</option>
                            <option>5 Orang</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="telepon"><strong>Kontak Aktif (No. Telp / WhatsApp)</strong></label>
                    </td>
                    <td>
                        <input type="text" id="telepon" name="telepon" placeholder="Contoh: 08123456789" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="universitas"><strong>Asal Instansi / Universitas</strong></label>
                    </td>
                    <td>
                        <input type="text" id="universitas" name="universitas" placeholder="Nama perguruan tinggi..." />
                    </td>
                </tr>
                <tr>
                    <td class="align-top">
                        <strong>Kategori Bidang Lomba</strong>
                    </td>
                    <td>
                        <div class="checkbox-group">
                            <label><input type="checkbox" id="coding" name="bidang" value="Coding" /> Pengembangan Perangkat Lunak (Coding)</label>
                            <label><input type="checkbox" id="desain" name="bidang" value="Desain" /> Desain Grafis</label>
                            <label><input type="checkbox" id="video" name="bidang" value="Video" /> Pembuatan Video Kreatif</label>
                            <label><input type="checkbox" id="essay" name="bidang" value="Essay" /> Penulisan Esai Ilmiah</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <strong>Status Kepesertaan</strong>
                    </td>
                    <td>
                        <div class="radio-group">
                            <label><input type="radio" id="mahasiswa" name="peserta" value="Mahasiswa" /> Mahasiswa Aktif</label>
                            <label><input type="radio" id="umum" name="peserta" value="Umum" /> Peserta Umum</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="align-top">
                        <label for="deskripsi"><strong>Ringkasan / Deskripsi Karya</strong></label>
                    </td>
                    <td>
                        <textarea id="deskripsi" name="deskripsi" rows="5" placeholder="Jelaskan secara singkat mengenai karya yang dilombakan..."></textarea>
                    </td>
                </tr>
                <tr>
                    <td class="align-top">
                        <label for="alasan"><strong>Motivasi Mengikuti Kompetisi</strong></label>
                    </td>
                    <td>
                        <textarea id="alasan" name="alasan" rows="4" placeholder="Tuliskan alasan atau tujuan mengikuti ajang ini..."></textarea>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="filekarya"><strong>Unggah Berkas Karya</strong></label>
                    </td>
                    <td>
                        <input type="file" id="filekarya" name="filekarya" accept="application/pdf, image/jpeg, image/png" />
                        <span class="file-note">Format yang diizinkan: PDF, JPG, PNG.</span>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="text-center">
                        <input type="submit" name="daftar" value="Kirim Pendaftaran" class="submit-btn" />
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
